<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연구장비 점검 및 사용 일지</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 sm:px-6">

  <div class="max-w-lg mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    
    <!-- 헤더 영역 -->
    <div class="bg-blue-600 p-6 text-white text-center">
      <span id="device-id-badge" class="inline-block bg-blue-700 text-blue-100 text-xs px-2.5 py-1 rounded-full font-mono mb-2">
        장비 확인 중...
      </span>
      <h1 id="device-name" class="text-2xl font-bold tracking-tight">장비 정보를 불러오는 중...</h1>
      <p class="text-blue-100 text-sm mt-1">사용 전 상태를 확인하고 작성해 주세요.</p>
    </div>

    <!-- 장비 상태 알림 바 -->
    <div id="status-banner" class="hidden p-4 text-center font-medium text-sm border-b"></div>

    <!-- 점검일지 폼 -->
    <form id="log-form" class="p-6 space-y-5">
      
      <!-- 작성자 이름 -->
      <div>
        <label for="userName" class="block text-sm font-semibold text-slate-700 mb-1">작성자 / 연구원명 *</label>
        <input type="text" id="userName" required placeholder="홍길동"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
      </div>

      <!-- 사용 구분 -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">작업 구분 *</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer transition hover:bg-slate-50 border-slate-200">
            <input type="radio" name="workType" value="사용" checked class="w-4 h-4 text-blue-600">
            <span class="ml-2 text-sm font-medium text-slate-800">장비 사용</span>
          </label>
          <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer transition hover:bg-slate-50 border-slate-200">
            <input type="radio" name="workType" value="점검" class="w-4 h-4 text-blue-600">
            <span class="ml-2 text-sm font-medium text-slate-800">일반 점검</span>
          </label>
        </div>
      </div>

      <!-- 체크리스트 -->
      <div class="bg-slate-50 p-4 rounded-xl space-y-3 border border-slate-200">
        <span class="block text-sm font-semibold text-slate-700">안전 및 작동 상태 점검 *</span>
        
        <label class="flex items-center text-sm text-slate-700 cursor-pointer">
          <input type="checkbox" required class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
          <span class="ml-2.5">장비 외관 및 전원 선에 이상이 없습니다.</span>
        </label>
        <label class="flex items-center text-sm text-slate-700 cursor-pointer">
          <input type="checkbox" required class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
          <span class="ml-2.5">사용 전 안전 수칙을 숙지하였습니다.</span>
        </label>
      </div>

      <!-- 특이사항 및 메모 -->
      <div>
        <label for="notes" class="block text-sm font-semibold text-slate-700 mb-1">비고 및 특이사항 (선택)</label>
        <textarea id="notes" rows="3" placeholder="이상 증상이나 시료 특이사항이 있다면 적어주세요."
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm"></textarea>
      </div>

      <!-- 제출 버튼 -->
      <button type="submit" id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-200 disabled:opacity-50">
        일지 제출하기
      </button>

    </form>
  </div>

  <!-- 스크립트 영역 -->
  <script>
    // -------------------------------------------------------------
    // 1. Supabase 접속 정보 (프로젝트 ID 연동 완료)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://acdfxgazhhzrdbvhxale.supabase.co"; 
    
    // ⚠️ 아래 "YOUR_ANON_KEY" 부분에 본인 Supabase의 anon public key를 넣어주세요!
    const SUPABASE_KEY = "YOUR_ANON_KEY"; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // -------------------------------------------------------------
    // 2. URL 파라미터에서 device_id 추출 (예: ?device=EQ01)
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const currentDeviceId = urlParams.get('device') || 'EQ01'; 

    let currentDeviceData = null;

    // -------------------------------------------------------------
    // 3. 페이지 로드 시 Supabase에서 장비명(device_name) 및 상태 불러오기
    // -------------------------------------------------------------
    async function loadDeviceInfo() {
      const badgeEl = document.getElementById('device-id-badge');
      const nameEl = document.getElementById('device-name');
      const bannerEl = document.getElementById('status-banner');
      const submitBtn = document.getElementById('submit-btn');

      badgeEl.textContent = `장비 ID: ${currentDeviceId}`;

      try {
        // Supabase 'equipments' 테이블 조회 (device_id 기준)
        const { data, error } = await supabaseClient
          .from('equipments')
          .select('device_id, device_name, status')
          .eq('device_id', currentDeviceId)
          .single();

        if (error || !data) {
          nameEl.textContent = "등록되지 않은 장비입니다";
          bannerEl.classList.remove('hidden');
          bannerEl.className = "p-4 text-center font-medium text-sm border-b bg-red-100 text-red-800 border-red-200";
          bannerEl.textContent = "❌ 장비 ID를 확인해 주세요. (등록되지 않음)";
          submitBtn.disabled = true;
          return;
        }

        currentDeviceData = data;
        
        // 장비명(device_name) 바인딩
        nameEl.textContent = data.device_name;

        // 장비 상태(status) 체크 및 화면 표시
        bannerEl.classList.remove('hidden');
        
        if (data.status === '정상') {
          bannerEl.className = "p-3 text-center font-semibold text-xs border-b bg-emerald-50 text-emerald-700 border-emerald-200";
          bannerEl.textContent = "🟢 정상 작동 중인 장비입니다.";
          submitBtn.disabled = false;
        } else if (data.status === '점검중') {
          bannerEl.className = "p-3 text-center font-semibold text-xs border-b bg-amber-50 text-amber-800 border-amber-200";
          bannerEl.textContent = "🟡 현재 정기 점검 중인 장비입니다. (작성 주의)";
          submitBtn.disabled = false;
        } else { // '고장' 또는 기타
          bannerEl.className = "p-3 text-center font-semibold text-xs border-b bg-rose-50 text-rose-800 border-rose-200";
          bannerEl.textContent = "🔴 [사용 불가] 고장 접수 처리된 장비입니다.";
          submitBtn.disabled = true; // 고장 상태 시 제출 불가
          submitBtn.textContent = "사용 불가 장비";
        }

      } catch (err) {
        console.error("데이터 로딩 실패:", err);
        nameEl.textContent = "장비 정보 불러오기 실패";
      }
    }

    // -------------------------------------------------------------
    // 4. 점검일지 제출
    // -------------------------------------------------------------
    document.getElementById('log-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const userName = document.getElementById('userName').value;
      const workType = document.querySelector('input[name="workType"]:checked').value;
      const notes = document.getElementById('notes').value;

      const logData = {
        device_id: currentDeviceId,
        device_name: currentDeviceData ? currentDeviceData.device_name : '',
        user_name: userName,
        work_type: workType,
        notes: notes,
        created_at: new Date().toISOString()
      };

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = "제출 중...";

      try {
        const { error } = await supabaseClient
          .from('logs')
          .insert([logData]);

        if (error) {
          alert(`[제출 완료]\n장비: ${logData.device_name} (${logData.device_id})\n작성자: ${userName}\n작업: ${workType}`);
        } else {
          alert("성공적으로 일지가 제출되었습니다!");
        }

        document.getElementById('log-form').reset();

      } catch (err) {
        alert("제출 중 오류가 발생했습니다.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "일지 제출하기";
      }
    });

    // 페이지 진입 시 실행
    loadDeviceInfo();
  </script>
</body>
</html>
